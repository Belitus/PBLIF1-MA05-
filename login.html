<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kelola Stok & Belanja Rumah Mudah</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="card shadow-lg p-4 style-auth-card" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <i class="fa-solid fa-boxes-packing fa-3x text-primary mb-2"></i>
      <h4 class="fw-bold text-dark">Kelola Stok & Belanja Rumah Mudah</h4>
    </div>

    <!-- Nav Tabs untuk Toggle Form -->
    <ul class="nav nav-pills nav-justified mb-3" id="authTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button">Login</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button">Registrasi</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Form Login -->
      <div class="tab-pane fade show active" id="login-panel">
        <form id="formLogin">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="loginUsername" class="form-control" placeholder="Masukkan username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">Masuk</button>
        </form>
      </div>

      <!-- Form Registrasi -->
      <div class="tab-pane fade" id="register-panel">
        <form id="formRegister">
          <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" id="regNama" class="form-control" placeholder="Nama Anda" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="regUsername" class="form-control" placeholder="Username baru" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-success w-100 fw-bold mt-2">Daftar Akun</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 1. Logika Registrasi User Baru
    document.getElementById('formRegister').addEventListener('submit', function(event) {
      event.preventDefault();

      let nama = document.getElementById('regNama').value.trim();
      let username = document.getElementById('regUsername').value.trim();
      let password = document.getElementById('regPassword').value.trim();

      // Ambil data users yang sudah ada di localStorage, atau buat array kosong
      let users = JSON.parse(localStorage.getItem('users')) || [];

      // Cek apakah username sudah terdaftar
      let userExist = users.find(u => u.username === username);
      if (userExist) {
        alert('Username sudah digunakan! Silakan gunakan username lain.');
        return;
      }

      // Simpan user baru ke dalam array
      users.push({ nama, username, password });
      localStorage.setItem('users', JSON.stringify(users));

      alert('Registrasi berhasil! Silakan login menggunakan akun Anda.');
      this.reset();

      // Pindahkan otomatis ke tab login
      const loginTab = new bootstrap.Tab(document.getElementById('login-tab'));
      loginTab.show();
    });

    // 2. Logika Validasi Login
    document.getElementById('formLogin').addEventListener('submit', function(event) {
      event.preventDefault();

      let usernameInput = document.getElementById('loginUsername').value.trim();
      let passwordInput = document.getElementById('loginPassword').value.trim();

      let users = JSON.parse(localStorage.getItem('users')) || [];

      // Cari user yang cocok dengan username dan password
      let foundUser = users.find(u => u.username === usernameInput && u.password === passwordInput);

      if (foundUser) {
        // Simpan sesi login aktif ke localStorage agar nama user bisa tampil di dashboard/mutasi
        localStorage.setItem('currentUser', JSON.stringify(foundUser));
        
        // Alihkan ke halaman dashboard
        window.location.href = "dashboard.html";
      } else {
        alert('Username atau Password salah! Gagal masuk ke sistem.');
      }
    });
  </script>
</body>
</html>

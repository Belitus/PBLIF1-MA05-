<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi - Sistem Aplikasi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-4">
            <h3 class="card-title text-center fw-bold mb-4">Buat Akun Baru</h3>
            <form action="login.html">
              <div class="mb-3">
                <label for="nama" class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="nama" placeholder="Nama Anda" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="email@contoh.com" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Kata Sandi</label>
                <input type="password" class="form-control" id="password" required>
              </div>
              <button type="submit" class="btn btn-success w-100 py-2">Daftar Sekarang</button>
            </form>
            <hr class="my-4">
            <p class="text-center mb-0">Sudah punya akun? <a href="login.html" class="text-decoration-none">Login</a></p>
        <!-- FOOTER - Sembunyikan saat dicetak -->
  <footer class="bg-white text-center py-3 border-top mt-auto no-print">
    <p class="text-muted small m-0">&copy; 2026 Sistem Pengelolaan Data. All rights reserved.</p>
  </footer>

  <script>
    if (localStorage.getItem("isLoggedIn") !== "true") {
      alert("Silakan login terlebih dahulu!");
      window.location.href = "login.html";
    }

    document.getElementById("btnLogout").addEventListener("click", function(e) {
      e.preventDefault();
      if (confirm("Yakin ingin logout?")) {
        localStorage.removeItem("isLoggedIn");
        window.location.href = "login.html";
      }
    });
  </script> 
        </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>

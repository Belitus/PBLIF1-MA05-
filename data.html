<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Data - Sistem Aplikasi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="dashboard.html">Sistem Data</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="data.html">Kelola Data</a></li>
          <li class="nav-item"><a class="nav-link" href="laporan.html">Laporan</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html">halaman login</a></li>
          <li class="nav-item"><a class="nav-link" href="mutasi.html">mutasi & belanja</a></li>
        </ul>
        <a href="login.html" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-4">Kelola Data Barang</h2>

    <div class="row">
      <!-- FORM INPUT DATA -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-bold">Form Input / Edit Data</div>
          <div class="card-body">
            <form id="formBarang">
              <input type="hidden" id="indexEdit">
              <div class="mb-3">
                <label for="namaBarang" class="form-label">Nama Barang</label>
                <input type="text" class="form-control" id="namaBarang" required>
              </div>
              <div class="mb-3">
                <label for="kategori" class="form-label">Kategori</label>
                <select class="form-select" id="kategori">
                  <option value="Elektronik">Elektronik</option>
                  <option value="Pakaian">Pakaian</option>
                  <option value="Makanan">Makanan</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="stok" class="form-label">Stok</label>
                <input type="number" class="form-control" id="stok" required>
              </div>
              <button type="submit" id="btnSimpan" class="btn btn-primary w-100">Tambah Data</button>
            </form>
          </div>
        </div>
      </div>

      <!-- TABEL DATA + PENCARIAN -->
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <!-- Form Pencarian -->
            <div class="row mb-3">
              <div class="col-md-6 ms-auto">
                <input type="text" id="inputCari" class="form-control" placeholder="Cari nama barang..." onkeyup="cariData()">
              </div>
            </div>

            <!-- Tabel Data -->
            <div class="table-responsive">
              <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                  <tr>
                    <th>No</th>
                    <th>Nama Barang</th>
                    <th>Kategori</th>
                    <th>Stok</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody id="tabelBody">
                  <!-- Data dipanggil via JavaScript -->
                </tbody>
              </table>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT LOGIKA JAVASCRIPT (CRUD + SEARCH) -->
  <script>
    let dataBarang = [
      { nama: "Laptop Asus", kategori: "Elektronik", stok: 10 },
      { nama: "Kemeja Polos", kategori: "Pakaian", stok: 25 }
    ];

    function tampilkanData() {
      let tbody = document.getElementById("tabelBody");
      tbody.innerHTML = "";

      dataBarang.forEach((item, index) => {
        tbody.innerHTML += `
          <tr>
            <td>${index + 1}</td>
            <td>${item.nama}</td>
            <td>${item.kategori}</td>
            <td>${item.stok}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-warning me-1" onclick="editData(${index})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="hapusData(${index})">Hapus</button>
            </td>
          </tr>
        `;
      });
    }

    // Tambah & Update Data
    document.getElementById("formBarang").addEventListener("submit", function(e) {
      e.preventDefault();
      let nama = document.getElementById("namaBarang").value;
      let kategori = document.getElementById("kategori").value;
      let stok = document.getElementById("stok").value;
      let indexEdit = document.getElementById("indexEdit").value;

      if (indexEdit === "") {
        // Tambah Data
        dataBarang.push({ nama, kategori, stok });
      } else {
        // Edit Data
        dataBarang[indexEdit] = { nama, kategori, stok };
        document.getElementById("indexEdit").value = "";
        document.getElementById("btnSimpan").innerText = "Tambah Data";
        document.getElementById("btnSimpan").className = "btn btn-primary w-100";
      }

      this.reset();
      tampilkanData();
    });

    // Edit Data
    function editData(index) {
      document.getElementById("namaBarang").value = dataBarang[index].nama;
      document.getElementById("kategori").value = dataBarang[index].kategori;
      document.getElementById("stok").value = dataBarang[index].stok;
      document.getElementById("indexEdit").value = index;

      document.getElementById("btnSimpan").innerText = "Update Data";
      document.getElementById("btnSimpan").className = "btn btn-success w-100";
    }

    // Hapus Data
    function hapusData(index) {
      if (confirm("Apakah yakin ingin menghapus data ini?")) {
        dataBarang.splice(index, 1);
        tampilkanData();
      }
    }

    // Pencarian Data
    function cariData() {
      let keyword = document.getElementById("inputCari").value.toLowerCase();
      let rows = document.querySelectorAll("#tabelBody tr");

      rows.forEach(row => {
        let nama = row.cells[1].innerText.toLowerCase();
        if (nama.includes(keyword)) {
          row.style.display = "";
        } else {
          row.style.display = "none";
        }
      });
    }

    // Load data awal
    tampilkanData();
  </script>
  <!-- FOOTER - Sembunyikan saat dicetak -->
  <footer class="bg-white text-center py-3 border-top mt-auto no-print">
    <p class="text-muted small m-0">&copy; 2026 Sistem Pengelolaan Data stok.</p>
  </footer>

  <script>
  </script>
</body>
</html>
